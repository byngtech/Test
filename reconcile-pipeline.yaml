pipeline:
  name: Reconcile Pipeline Templates
  identifier: reconcile_pipeline_templates
  projectIdentifier: <+input>   # e.g. apisample
  orgIdentifier: <+input>       # e.g. default
  tags: {}
  variables:
    - name: slack_webhook_url
      type: String
      description: "Optional Slack incoming webhook for the run summary. Leave as <+input> default empty string if unused."
      required: false
      value: ""
  stages:
    - stage:
        name: Reconcile Templates
        identifier: reconcile_templates
        description: "Finds pipelines whose linked templates have drifted, and opens a PR with the reconciled YAML"
        type: Custom
        spec:
          execution:
            steps:
              - step:
                  type: ShellScript
                  name: Reconcile and Open PRs
                  identifier: reconcile_and_open_prs
                  timeout: 30m
                  spec:
                    shell: Bash
                    onDelegate: true
                    source:
                      type: Inline
                      spec:
                        script: |-
                          #!/bin/bash
                          set -euo pipefail

                          # ---------------------------------------------------------------
                          # Config (injected via environment variables below)
                          # ---------------------------------------------------------------
                          : "${HARNESS_API_KEY:?missing}"
                          : "${ACCOUNT_ID:?missing}"
                          : "${ORG_ID:?missing}"
                          : "${PROJECT_ID:?missing}"
                          : "${GIT_TOKEN:?missing}"
                          # NOTE: repo, owner, and base branch are NOT fixed globally.
                          # Pipelines in this project can live in different repos AND
                          # different GitHub orgs, so all three are resolved per-pipeline
                          # below (owner/repo via the pipeline's Git connector, branch is
                          # hardcoded to "main" per org policy).

                          HARNESS_BASE="https://app.harness.io"
                          GITHUB_API="https://api.github.com"
                          SUMMARY_FILE=$(mktemp)
                          echo "Reconciliation run: $(date -u +%Y-%m-%dT%H:%M:%SZ)" > "$SUMMARY_FILE"

                          # Make sure jq is available (most delegate images ship it; fall back to apt if not)
                          if ! command -v jq >/dev/null 2>&1; then
                            echo "jq not found, attempting install..."
                            (apt-get update -qq && apt-get install -y -qq jq) || {
                              echo "ERROR: jq is required but could not be installed on this delegate. Add it to a custom delegate image." >&2
                              exit 1
                            }
                          fi

                          # Make sure the GO-BASED mikefarah/yq is available (NOT the Python 'yq' from
                          # apt/pip, which is a different tool with an incompatible CLI entirely).
                          # mikefarah/yq ALSO has two incompatible generations of its own:
                          #   v3.x -> subcommand style:  yq r -j -        (read, --tojson, stdin)
                          #   v4.x -> eval style:        yq -o=json eval '.' -
                          # We detect which one is actually installed and dispatch accordingly, so this
                          # keeps working whether the image has v3 (as of this run) or gets bumped to v4
                          # later. Recommendation either way: bake yq into this step's image rather than
                          # relying on a runtime download -- GitHub release downloads can hit rate limits
                          # or be blocked entirely by delegate network policy.
                          if ! command -v yq >/dev/null 2>&1; then
                            echo "ERROR: yq not found. Install mikefarah/yq (https://github.com/mikefarah/yq) into this step's container image." >&2
                            exit 1
                          fi

                          YQ_MAJOR=""
                          if printf 'a: 1\n' | yq r -j - >/dev/null 2>&1; then
                            YQ_MAJOR="3"
                          elif printf 'a: 1\n' | yq -o=json eval '.' - >/dev/null 2>&1; then
                            YQ_MAJOR="4"
                          fi

                          if [ -z "$YQ_MAJOR" ]; then
                            echo "ERROR: 'yq' was found but neither v3 ('yq r -j -') nor v4 ('yq -o=json eval') syntax works. This is likely the Python-based yq (from apt/pip), not mikefarah/yq. Replace it with the Go binary from https://github.com/mikefarah/yq/releases in this step's image." >&2
                            exit 1
                          fi
                          echo "Detected mikefarah/yq v${YQ_MAJOR} syntax."

                          # ---------------------------------------------------------------
                          # Helper: canonicalize a YAML string into sorted-key JSON so that
                          # two YAML documents that are semantically identical (regardless of
                          # quote style, key order, indentation, or comments) produce the
                          # exact same output string. Uses yq to convert YAML -> JSON, then
                          # jq -cS to produce compact, sorted-key canonical JSON.
                          # ---------------------------------------------------------------
                          normalize_yaml() {
                            local input json err
                            input="$(cat)"
                            if [ "$YQ_MAJOR" = "3" ]; then
                              if ! json="$(printf '%s' "$input" | yq r -j - 2>/dev/null)"; then
                                err="$(printf '%s' "$input" | yq r -j - 2>&1 1>/dev/null)"
                                echo "__YAML_PARSE_ERROR__:$err" >&2
                                return 1
                              fi
                            else
                              if ! json="$(printf '%s' "$input" | yq -o=json eval '.' - 2>/dev/null)"; then
                                err="$(printf '%s' "$input" | yq -o=json eval '.' - 2>&1 1>/dev/null)"
                                echo "__YAML_PARSE_ERROR__:$err" >&2
                                return 1
                              fi
                            fi
                            printf '%s' "$json" | jq -cS '.'
                          }

                          # ---------------------------------------------------------------
                          # 1. List pipelines in the project (paginated), keep Git-backed ones
                          # ---------------------------------------------------------------
                          echo "Fetching pipeline list for org=$ORG_ID project=$PROJECT_ID ..."
                          page=0
                          limit=100
                          all_pipelines="[]"

                          while true; do
                            resp=$(curl -s -X GET \
                              "${HARNESS_BASE}/v1/orgs/${ORG_ID}/projects/${PROJECT_ID}/pipelines?page=${page}&limit=${limit}" \
                              -H "Harness-Account: ${ACCOUNT_ID}" \
                              -H "x-api-key: ${HARNESS_API_KEY}")

                            count=$(echo "$resp" | jq 'length')
                            if [ "$count" -eq 0 ]; then
                              break
                            fi

                            all_pipelines=$(jq -s '.[0] + .[1]' <(echo "$all_pipelines") <(echo "$resp"))
                            page=$((page + 1))

                            if [ "$count" -lt "$limit" ]; then
                              break
                            fi
                          done

                          remote_ids=$(echo "$all_pipelines" | jq -r '.[] | select(.git_details.store_type=="REMOTE") | .identifier')

                          if [ -z "$remote_ids" ]; then
                            echo "No Git-backed (Remote) pipelines found in this project. Nothing to reconcile."
                            cat "$SUMMARY_FILE"
                            exit 0
                          fi

                          echo "Found remote pipelines:"
                          echo "$remote_ids"
                          echo "---"

                          # ---------------------------------------------------------------
                          # Helper: base64 encode without line wrapping (portable)
                          # ---------------------------------------------------------------
                          b64() { base64 -w0 2>/dev/null || base64; }

                          # ---------------------------------------------------------------
                          # Helper: resolve a Harness connector_ref to a Harness connector
                          # API call, honoring account./org./project scope prefixes
                          # ---------------------------------------------------------------
                          fetch_connector() {
                            local connector_ref="$1"
                            local conn_id="$connector_ref"
                            local scope_qp=""

                            if [[ "$connector_ref" == account.* ]]; then
                              conn_id="${connector_ref#account.}"
                              scope_qp="accountIdentifier=${ACCOUNT_ID}"
                            elif [[ "$connector_ref" == org.* ]]; then
                              conn_id="${connector_ref#org.}"
                              scope_qp="accountIdentifier=${ACCOUNT_ID}&orgIdentifier=${ORG_ID}"
                            else
                              scope_qp="accountIdentifier=${ACCOUNT_ID}&orgIdentifier=${ORG_ID}&projectIdentifier=${PROJECT_ID}"
                            fi

                            curl -s -X GET \
                              "${HARNESS_BASE}/ng/api/connectors/${conn_id}?${scope_qp}" \
                              -H "x-api-key: ${HARNESS_API_KEY}"
                          }

                          # ---------------------------------------------------------------
                          # Helper: given a connector's git URL, split out "owner" and,
                          # if present, "repo" (Account-scoped connectors only give owner;
                          # Repo-scoped connectors give owner+repo, which takes precedence
                          # over git_details.repo_name if they ever disagree)
                          # ---------------------------------------------------------------
                          parse_owner_repo() {
                            local url="$1"
                            local clean="${url%.git}"
                            clean="${clean#https://}"
                            clean="${clean#http://}"
                            clean="${clean#git@}"
                            clean="${clean/://}"   # turn git@host:owner/repo into host/owner/repo
                            clean="${clean#*/}"     # drop the host segment, leaving owner[/repo]
                            echo "$clean"
                          }

                          out_of_sync_count=0

                          # ---------------------------------------------------------------
                          # 2. For each pipeline: fetch current + refreshed YAML, diff, and
                          #    if different, push a branch + open a PR
                          # ---------------------------------------------------------------
                          for pid in $remote_ids; do
                            echo "== Checking pipeline: $pid =="

                            pipeline_detail=$(curl -s -X GET \
                              "${HARNESS_BASE}/v1/orgs/${ORG_ID}/projects/${PROJECT_ID}/pipelines/${pid}" \
                              -H "Harness-Account: ${ACCOUNT_ID}" \
                              -H "x-api-key: ${HARNESS_API_KEY}")

                            current_yaml=$(echo "$pipeline_detail" | jq -r '.pipeline_yaml')
                            file_path=$(echo "$pipeline_detail" | jq -r '.git_details.file_path // empty')
                            repo_name_hint=$(echo "$pipeline_detail" | jq -r '.git_details.repo_name // empty')
                            connector_ref=$(echo "$pipeline_detail" | jq -r '.git_details.connector_ref // empty')
                            # Org policy: every repo's default branch is always "main".
                            base_branch="main"

                            if [ -z "$file_path" ] || [ -z "$connector_ref" ]; then
                              echo "  WARN: could not determine file_path/connector_ref for $pid, skipping."
                              echo "$pid: SKIPPED (incomplete git_details)" >> "$SUMMARY_FILE"
                              continue
                            fi

                            connector_resp=$(fetch_connector "$connector_ref")
                            connector_url=$(echo "$connector_resp" | jq -r '.data.connector.spec.url // empty')
                            connector_type=$(echo "$connector_resp" | jq -r '.data.connector.spec.type // empty')

                            if [ -z "$connector_url" ]; then
                              echo "  WARN: could not resolve connector '${connector_ref}' for $pid (response: $connector_resp), skipping."
                              echo "$pid: SKIPPED (connector lookup failed)" >> "$SUMMARY_FILE"
                              continue
                            fi

                            owner_repo=$(parse_owner_repo "$connector_url")
                            repo_owner="${owner_repo%%/*}"

                            if [ "$connector_type" == "Repo" ] && [[ "$owner_repo" == */* ]]; then
                              # Repo-scoped connector: URL already contains the exact repo, trust it
                              repo_name="${owner_repo#*/}"
                            else
                              # Account-scoped connector: URL only gives the owner/org,
                              # so pair it with the repo name from git_details
                              repo_name="$repo_name_hint"
                            fi

                            if [ -z "$repo_owner" ] || [ -z "$repo_name" ]; then
                              echo "  WARN: could not resolve owner/repo for $pid (connector_url=$connector_url, type=$connector_type), skipping."
                              echo "$pid: SKIPPED (owner/repo resolution failed)" >> "$SUMMARY_FILE"
                              continue
                            fi

                            echo "  Repo: ${repo_owner}/${repo_name}  Base branch: ${base_branch}  Path: ${file_path}"

                            refresh_resp=$(curl -s -X POST \
                              "${HARNESS_BASE}/template/api/refresh-template/refreshed-yaml?accountIdentifier=${ACCOUNT_ID}&orgIdentifier=${ORG_ID}&projectIdentifier=${PROJECT_ID}&pipelineIdentifier=${pid}" \
                              -H "x-api-key: ${HARNESS_API_KEY}")

                            refreshed_yaml=$(echo "$refresh_resp" | jq -r '.data.refreshedYaml // empty')

                            if [ -z "$refreshed_yaml" ]; then
                              echo "  INFO: no refreshed YAML returned (likely already in sync, or no templates referenced). Skipping."
                              echo "$pid: in sync" >> "$SUMMARY_FILE"
                              continue
                            fi

                            if [ "$current_yaml" == "$refreshed_yaml" ]; then
                              echo "  Pipeline $pid is byte-for-byte identical. In sync."
                              echo "$pid: in sync" >> "$SUMMARY_FILE"
                              continue
                            fi

                            # Text differs -- but that might just be quote style, key order,
                            # or comments changing. Do a STRUCTURAL comparison instead.
                            current_norm=$(printf '%s' "$current_yaml" | normalize_yaml) || {
                              echo "  WARN: could not parse current YAML for $pid as valid YAML, skipping."
                              echo "$pid: SKIPPED (current YAML failed to parse)" >> "$SUMMARY_FILE"
                              continue
                            }
                            refreshed_norm=$(printf '%s' "$refreshed_yaml" | normalize_yaml) || {
                              echo "  WARN: could not parse refreshed YAML for $pid as valid YAML, skipping."
                              echo "$pid: SKIPPED (refreshed YAML failed to parse)" >> "$SUMMARY_FILE"
                              continue
                            }

                            if [ "$current_norm" == "$refreshed_norm" ]; then
                              echo "  Pipeline $pid text differs (quotes/whitespace/comments/key order) but content is IDENTICAL. Ignoring."
                              echo "$pid: in sync (cosmetic-only diff ignored)" >> "$SUMMARY_FILE"
                              continue
                            fi

                            echo "  Pipeline $pid is OUT OF SYNC. Preparing a PR..."
                            out_of_sync_count=$((out_of_sync_count + 1))

                            new_branch="reconcile/${pid}-$(date +%Y%m%d%H%M%S)"

                            # --- Get base branch SHA ---
                            base_ref=$(curl -s -X GET \
                              "${GITHUB_API}/repos/${repo_owner}/${repo_name}/git/ref/heads/${base_branch}" \
                              -H "Authorization: token ${GIT_TOKEN}")
                            base_sha=$(echo "$base_ref" | jq -r '.object.sha // empty')

                            if [ -z "$base_sha" ]; then
                              echo "  ERROR: could not resolve base branch SHA for ${repo_owner}/${repo_name}@${base_branch}. Response: $base_ref"
                              echo "$pid: FAILED (could not resolve base branch)" >> "$SUMMARY_FILE"
                              continue
                            fi

                            # --- Create new branch off base ---
                            create_branch_resp=$(curl -s -X POST \
                              "${GITHUB_API}/repos/${repo_owner}/${repo_name}/git/refs" \
                              -H "Authorization: token ${GIT_TOKEN}" \
                              -d "{\"ref\": \"refs/heads/${new_branch}\", \"sha\": \"${base_sha}\"}")

                            branch_ok=$(echo "$create_branch_resp" | jq -r '.ref // empty')
                            if [ -z "$branch_ok" ]; then
                              echo "  ERROR: could not create branch ${new_branch} in ${repo_owner}/${repo_name}. Response: $create_branch_resp"
                              echo "$pid: FAILED (branch creation)" >> "$SUMMARY_FILE"
                              continue
                            fi

                            # --- Get current file SHA on the new branch (needed to update it) ---
                            file_meta=$(curl -s -X GET \
                              "${GITHUB_API}/repos/${repo_owner}/${repo_name}/contents/${file_path}?ref=${new_branch}" \
                              -H "Authorization: token ${GIT_TOKEN}")
                            file_sha=$(echo "$file_meta" | jq -r '.sha // empty')

                            if [ -z "$file_sha" ]; then
                              echo "  ERROR: could not find file ${file_path} in ${repo_owner}/${repo_name}@${new_branch}. Response: $file_meta"
                              echo "$pid: FAILED (file lookup)" >> "$SUMMARY_FILE"
                              continue
                            fi

                            encoded_content=$(printf '%s' "$refreshed_yaml" | b64)

                            update_resp=$(curl -s -X PUT \
                              "${GITHUB_API}/repos/${repo_owner}/${repo_name}/contents/${file_path}" \
                              -H "Authorization: token ${GIT_TOKEN}" \
                              -d "{\"message\": \"Reconcile pipeline ${pid} with latest template version\", \"content\": \"${encoded_content}\", \"sha\": \"${file_sha}\", \"branch\": \"${new_branch}\"}")

                            commit_ok=$(echo "$update_resp" | jq -r '.commit.sha // empty')
                            if [ -z "$commit_ok" ]; then
                              echo "  ERROR: could not commit reconciled YAML to ${repo_owner}/${repo_name}. Response: $update_resp"
                              echo "$pid: FAILED (commit)" >> "$SUMMARY_FILE"
                              continue
                            fi

                            # --- Open the PR ---
                            pr_body="Automated template reconciliation for pipeline \`${pid}\`.\n\nThis PR updates the pipeline YAML to match the latest version of its referenced org/account-level templates. Generated by the Reconcile Pipeline Templates job on $(date -u +%Y-%m-%dT%H:%M:%SZ)."
                            pr_resp=$(curl -s -X POST \
                              "${GITHUB_API}/repos/${repo_owner}/${repo_name}/pulls" \
                              -H "Authorization: token ${GIT_TOKEN}" \
                              -d "{\"title\": \"Reconcile pipeline: ${pid}\", \"head\": \"${new_branch}\", \"base\": \"${base_branch}\", \"body\": \"${pr_body}\"}")

                            pr_url=$(echo "$pr_resp" | jq -r '.html_url // empty')

                            if [ -z "$pr_url" ]; then
                              echo "  ERROR: could not open PR in ${repo_owner}/${repo_name}. Response: $pr_resp"
                              echo "$pid: FAILED (PR creation)" >> "$SUMMARY_FILE"
                            else
                              echo "  PR opened: $pr_url"
                              echo "$pid: PR opened -> $pr_url" >> "$SUMMARY_FILE"
                            fi
                          done

                          echo "---"
                          echo "Reconciliation summary:"
                          cat "$SUMMARY_FILE"

                          # ---------------------------------------------------------------
                          # 3. Optional Slack notification
                          # ---------------------------------------------------------------
                          if [ -n "${SLACK_WEBHOOK_URL:-}" ]; then
                            summary_text=$(cat "$SUMMARY_FILE" | sed 's/"/\\"/g')
                            curl -s -X POST "$SLACK_WEBHOOK_URL" \
                              -H "Content-Type: application/json" \
                              -d "{\"text\": \"*Pipeline Template Reconciliation*\n\`\`\`${summary_text}\`\`\`\"}" \
                              > /dev/null || echo "WARN: Slack notification failed"
                          fi

                          if [ "$out_of_sync_count" -gt 0 ]; then
                            echo "Done. ${out_of_sync_count} pipeline(s) needed reconciliation. See PR links above."
                          else
                            echo "Done. All pipelines already in sync."
                          fi
                    environmentVariables:
                      - name: HARNESS_API_KEY
                        type: String
                        value: <+secrets.getValue("harness_api_key")>
                      - name: ACCOUNT_ID
                        type: String
                        value: <+account.identifier>
                      - name: ORG_ID
                        type: String
                        value: <+org.identifier>
                      - name: PROJECT_ID
                        type: String
                        value: <+project.identifier>
                      - name: GIT_TOKEN
                        type: String
                        value: <+secrets.getValue("git_pat_token")>
                      - name: SLACK_WEBHOOK_URL
                        type: String
                        value: <+pipeline.variables.slack_webhook_url>
                    outputVariables: []
        tags: {}
